<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>HVAC & Hardscape Finder</title>
  <style>
    /* ── Reset ── */
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    /* ── Design Tokens ── */
    :root {
      --bg:           #0d1117;
      --surface:      #161b22;
      --surface2:     #1c2128;
      --surface3:     #21262d;
      --border:       #30363d;
      --border-soft:  #21262d;
      --text:         #e6edf3;
      --text-muted:   #7d8590;
      --text-dim:     #484f58;
      --primary:      #f59e0b;
      --primary-glow: rgba(245,158,11,0.15);
      --hvac-primary:      #3b82f6;
      --hvac-primary-glow: rgba(59,130,246,0.15);
      --success:      #3fb950;
      --warn:         #d29922;
      --danger:       #f85149;
      --radius:       6px;
      --radius-sm:    4px;
    }

    /* ── Base ── */
    html, body {
      width: 340px;
      background: var(--bg);
      color: var(--text);
      font-family: 'Segoe UI', system-ui, -apple-system, sans-serif;
      font-size: 12px;
      line-height: 1.4;
      overflow-x: hidden;
    }

    .popup-wrap {
      padding: 8px;
      display: flex;
      flex-direction: column;
      gap: 6px;
    }

    /* ── Header ── */
    .header {
      display: flex;
      justify-content: space-between;
      align-items: center;
    }
    .header-left {
      display: flex;
      align-items: center;
      gap: 5px;
    }
    .header-title {
      font-size: 13px;
      font-weight: 700;
      color: var(--text);
      letter-spacing: -0.2px;
    }
    .header-title .accent-hs  { color: var(--primary); }
    .header-title .accent-hvac { color: var(--hvac-primary); }
    .ver-badge {
      font-size: 9px;
      font-weight: 600;
      color: var(--text-muted);
      background: var(--surface3);
      border: 1px solid var(--border);
      padding: 1px 5px;
      border-radius: 10px;
    }
    .header-actions {
      display: flex;
      gap: 4px;
      align-items: center;
    }

    /* ── Mode Toggle ── */
    .mode-toggle {
      display: flex;
      gap: 4px;
      background: var(--surface2);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      padding: 3px;
    }
    .mode-btn {
      flex: 1;
      padding: 5px 8px;
      border: 1px solid transparent;
      border-radius: var(--radius-sm);
      font-size: 10.5px;
      font-weight: 700;
      cursor: pointer;
      transition: all 0.18s ease;
      background: transparent;
      color: var(--text-muted);
      text-align: center;
      letter-spacing: 0.2px;
    }
    .mode-btn:hover { color: var(--text); background: var(--surface3); }
    .mode-btn.active-hvac {
      background: linear-gradient(135deg, #1d4ed8, #3b82f6);
      border-color: #2563eb;
      color: #fff;
      box-shadow: 0 2px 8px rgba(59,130,246,0.3);
    }
    .mode-btn.active-hs {
      background: linear-gradient(135deg, #d97706, #f59e0b);
      border-color: #d97706;
      color: #fff;
      box-shadow: 0 2px 8px rgba(245,158,11,0.3);
    }

    /* ── Status chip ── */
    .status-chip {
      font-size: 10px;
      font-weight: 600;
      color: var(--text-muted);
      background: var(--surface3);
      border: 1px solid var(--border);
      padding: 2px 7px;
      border-radius: 10px;
    }

    /* ── Progress bar ── */
    .progress-bar {
      width: 100%;
      height: 2px;
      background: var(--border);
      border-radius: 10px;
      display: none;
      overflow: hidden;
    }
    .progress-bar.active { display: block; }
    .progress-fill {
      height: 100%;
      width: 0%;
      background: linear-gradient(90deg, var(--primary), #fbbf24);
      border-radius: 10px;
      transition: width 0.1s linear;
    }
    .progress-fill.hvac-fill {
      background: linear-gradient(90deg, #1d4ed8, #3b82f6, #60a5fa);
    }

    /* ── Icon Buttons ── */
    .btn-icon {
      background: var(--surface2);
      color: var(--text-muted);
      border: 1px solid var(--border);
      padding: 3px 7px;
      border-radius: var(--radius-sm);
      font-size: 11px;
      cursor: pointer;
      transition: color 0.15s, border-color 0.15s, background 0.15s;
      line-height: 1;
    }
    .btn-icon:hover { color: var(--text); border-color: var(--text-muted); background: var(--surface3); }
    .btn-icon.active { color: var(--primary); border-color: var(--primary); }

    /* ── Scan Buttons ── */
    .scan-row {
      display: flex;
      gap: 5px;
    }
    .btn-scan-primary {
      flex: 1;
      padding: 7px 8px;
      background: linear-gradient(135deg, #d97706, #f59e0b);
      color: #fff;
      border: none;
      border-radius: var(--radius);
      font-weight: 700;
      font-size: 11px;
      cursor: pointer;
      transition: opacity 0.15s, transform 0.1s;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 4px;
      white-space: nowrap;
      box-shadow: 0 2px 8px rgba(245,158,11,0.25);
    }
    .btn-scan-primary.hvac-mode {
      background: linear-gradient(135deg, #1d4ed8, #3b82f6);
      box-shadow: 0 2px 8px rgba(59,130,246,0.25);
    }
    .btn-scan-primary:hover:not(:disabled) { opacity: 0.88; transform: translateY(-1px); }
    .btn-scan-primary:active:not(:disabled) { transform: translateY(0); }
    .btn-scan-primary:disabled { opacity: 0.4; cursor: not-allowed; }

    .btn-scan-secondary {
      flex: 1;
      padding: 7px 8px;
      background: var(--surface2);
      color: var(--text);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      font-weight: 600;
      font-size: 11px;
      cursor: pointer;
      transition: border-color 0.15s, background 0.15s;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 4px;
      white-space: nowrap;
    }
    .btn-scan-secondary:hover:not(:disabled) { border-color: var(--primary); background: var(--surface3); }
    .btn-scan-secondary.hvac-mode:hover:not(:disabled) { border-color: var(--hvac-primary); }
    .btn-scan-secondary:disabled { opacity: 0.4; cursor: not-allowed; }

    /* ── Primary Result Card ── */
    .primary-card {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      padding: 10px 12px;
      position: relative;
      overflow: hidden;
    }
    .primary-card::before {
      content: '';
      position: absolute;
      top: 0; left: 0; right: 0;
      height: 2px;
      background: linear-gradient(90deg, #d97706, #f59e0b, #fbbf24);
    }
    .primary-card.hvac-card::before {
      background: linear-gradient(90deg, #1d4ed8, #3b82f6, #60a5fa);
    }
    .primary-top {
      display: flex;
      justify-content: space-between;
      align-items: flex-start;
    }
    .primary-meta {
      font-size: 9px;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 0.6px;
      color: var(--primary);
      margin-bottom: 2px;
    }
    .primary-meta.hvac-meta { color: var(--hvac-primary); }
    .primary-name {
      font-size: 13px;
      font-weight: 800;
      letter-spacing: -0.3px;
      color: var(--text);
      line-height: 1.2;
    }
    .primary-conf {
      font-size: 22px;
      font-weight: 900;
      line-height: 1;
      margin-top: 2px;
      min-width: 50px;
      text-align: right;
    }
    .primary-conf.high   { color: #3fb950; }
    .primary-conf.medium { color: #d29922; }
    .primary-conf.low    { color: var(--text-muted); }

    /* ── HVAC Verdict Badge ── */
    .hvac-verdict {
      display: inline-flex;
      align-items: center;
      gap: 5px;
      margin-top: 6px;
      padding: 3px 8px;
      border-radius: 10px;
      font-size: 10px;
      font-weight: 700;
    }
    .hvac-verdict.yes { background: rgba(63,185,80,0.15); border: 1px solid rgba(63,185,80,0.35); color: #3fb950; }
    .hvac-verdict.no  { background: rgba(248,81,73,0.12); border: 1px solid rgba(248,81,73,0.30); color: #f85149; }
    .hvac-verdict.uncertain { background: rgba(210,153,34,0.12); border: 1px solid rgba(210,153,34,0.30); color: #d29922; }

    .primary-reasons {
      font-size: 10px;
      color: var(--text-muted);
      margin-top: 5px;
      line-height: 1.4;
    }

    /* ── Detected Services Chips ── */
    .detected-services {
      background: var(--surface);
      border: 1px solid var(--border-soft);
      border-radius: var(--radius);
      padding: 7px 9px;
    }
    .section-label {
      font-size: 9px;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 0.5px;
      color: var(--primary);
      margin-bottom: 5px;
    }
    .section-label.hvac-label { color: var(--hvac-primary); }
    .section-label.muted    { color: var(--text-muted); }
    .section-label.negative { color: var(--danger); }
    .chip-row {
      display: flex;
      flex-wrap: wrap;
      gap: 3px;
    }
    .service-chip {
      font-size: 9px;
      font-weight: 600;
      background: rgba(245,158,11,0.12);
      border: 1px solid rgba(245,158,11,0.35);
      color: #fbbf24;
      padding: 2px 7px;
      border-radius: 10px;
    }
    .service-chip.hvac-chip {
      background: rgba(59,130,246,0.12);
      border-color: rgba(59,130,246,0.35);
      color: #93c5fd;
    }
    .sec-chip {
      font-size: 9px;
      font-weight: 600;
      background: rgba(52,211,153,0.10);
      border: 1px solid rgba(52,211,153,0.25);
      color: #34d399;
      padding: 2px 7px;
      border-radius: 10px;
    }
    .neg-chip {
      font-size: 9px;
      font-weight: 600;
      background: rgba(248,81,73,0.10);
      border: 1px solid rgba(248,81,73,0.30);
      color: #f85149;
      padding: 2px 7px;
      border-radius: 10px;
    }

    /* ── Service Grid ── */
    .result-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 4px;
    }
    .result-grid.three-col { grid-template-columns: 1fr 1fr 1fr; }
    .service-card {
      background: var(--surface2);
      border: 1px solid var(--border-soft);
      border-radius: var(--radius);
      padding: 7px 6px;
      text-align: center;
      transition: border-color 0.15s;
    }
    .service-card.is-primary {
      border-color: var(--primary);
      box-shadow: 0 0 0 1px var(--primary-glow);
    }
    .service-card.is-primary-hvac {
      border-color: var(--hvac-primary);
      box-shadow: 0 0 0 1px var(--hvac-primary-glow);
    }
    .service-icon  { font-size: 14px; line-height: 1; margin-bottom: 3px; }
    .service-name  { font-size: 8px; font-weight: 600; color: var(--text-muted); margin-bottom: 1px; line-height: 1.2; }
    .service-score {
      font-size: 17px;
      font-weight: 900;
      line-height: 1;
      margin: 2px 0;
    }
    .bar-bg {
      width: 100%;
      height: 2px;
      background: var(--border);
      border-radius: 4px;
      margin: 4px 0 3px;
      overflow: hidden;
    }
    .bar-fill {
      height: 100%;
      border-radius: 4px;
      transition: width 0.4s cubic-bezier(.4,0,.2,1);
    }
    .service-matches { font-size: 9px; color: var(--text-muted); }

    /* ── Collapsible Sections ── */
    .collapsible {
      background: var(--surface);
      border: 1px solid var(--border-soft);
      border-radius: var(--radius);
      overflow: hidden;
    }
    .collapsible-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 6px 9px;
      cursor: pointer;
      user-select: none;
      transition: background 0.12s;
      gap: 6px;
    }
    .collapsible-header:hover { background: var(--surface2); }
    .collapsible-title {
      font-size: 10px;
      font-weight: 700;
      color: var(--text-muted);
      text-transform: uppercase;
      letter-spacing: 0.5px;
      display: flex;
      align-items: center;
      gap: 5px;
    }
    .collapsible-count {
      font-size: 9px;
      font-weight: 600;
      background: var(--surface3);
      border: 1px solid var(--border);
      color: var(--text-muted);
      padding: 1px 5px;
      border-radius: 8px;
    }
    .collapsible-arrow {
      font-size: 9px;
      color: var(--text-dim);
      transition: transform 0.2s;
      flex-shrink: 0;
    }
    .collapsible.open .collapsible-arrow { transform: rotate(180deg); }
    .collapsible-body {
      display: none;
      padding: 0 9px 8px;
      border-top: 1px solid var(--border-soft);
    }
    .collapsible.open .collapsible-body { display: block; }

    /* ── Why Classified ── */
    .reason-item {
      font-size: 10px;
      color: var(--text);
      padding: 4px 0;
      border-bottom: 1px solid var(--border-soft);
      line-height: 1.4;
    }
    .reason-item:last-child { border-bottom: none; }

    /* ── Evidence items ── */
    .evidence-category { padding-top: 7px; }
    .evidence-cat-label {
      font-size: 9px;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 0.4px;
      margin-bottom: 4px;
      padding-left: 6px;
      display: flex;
      align-items: center;
      justify-content: space-between;
    }
    .evidence-count-sm {
      font-size: 9px;
      color: var(--text-dim);
      font-weight: 500;
    }
    .evidence-item {
      background: var(--surface2);
      border: 1px solid var(--border-soft);
      border-radius: var(--radius-sm);
      padding: 5px 7px;
      margin-bottom: 3px;
      cursor: pointer;
      transition: border-color 0.1s, background 0.1s;
      border-left-width: 2px;
    }
    .evidence-item:hover { border-color: var(--primary); background: var(--surface3); }
    .evidence-text {
      font-size: 10px;
      color: var(--text);
      margin-bottom: 3px;
      line-height: 1.35;
    }
    .evidence-meta {
      display: flex;
      align-items: center;
      gap: 3px;
      flex-wrap: wrap;
    }
    .badge-zone {
      font-size: 9px;
      background: var(--primary-glow);
      color: var(--primary);
      padding: 1px 5px;
      border-radius: 8px;
      font-weight: 600;
    }
    .badge-zone.hvac-zone {
      background: var(--hvac-primary-glow);
      color: var(--hvac-primary);
    }
    .badge-term {
      font-size: 9px;
      background: var(--surface3);
      color: var(--text-muted);
      padding: 1px 5px;
      border-radius: 8px;
      font-weight: 600;
    }
    .badge-tier {
      font-size: 8px;
      padding: 1px 4px;
      border-radius: 8px;
      font-weight: 700;
    }
    .badge-tier.tier-1 { background: rgba(248,81,73,0.15);  color: #f85149; }
    .badge-tier.tier-2 { background: rgba(245,158,11,0.15); color: #f59e0b; }
    .badge-tier.tier-3 { background: rgba(96,165,250,0.15); color: #60a5fa; }
    .badge-tier.tier-4 { background: rgba(125,134,148,0.15); color: #7d8590; }
    .badge-weight {
      font-size: 9px;
      background: rgba(245,158,11,0.2);
      color: #fbbf24;
      padding: 1px 5px;
      border-radius: 8px;
      font-weight: 700;
    }
    .jump-link {
      margin-left: auto;
      color: var(--text-dim);
      font-size: 10px;
    }
    .more-items {
      font-size: 9px;
      color: var(--text-dim);
      padding: 3px 0 1px;
      text-align: center;
    }
    .no-evidence {
      font-size: 10px;
      color: var(--text-muted);
      padding: 8px 0;
      text-align: center;
    }

    /* ── Term frequency ── */
    .term-row { padding-top: 7px; }
    .term-cat-label {
      font-size: 9px;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 0.4px;
      margin-bottom: 4px;
    }
    .term-chips { display: flex; flex-wrap: wrap; gap: 3px; }
    .term-badge {
      font-size: 9px;
      background: var(--surface3);
      border: 1px solid var(--border);
      padding: 1px 6px;
      border-radius: 8px;
      color: var(--text-muted);
    }
    .term-more { font-size: 9px; color: var(--text-dim); }

    /* ── Secondary / Negative sections ── */
    .secondary-section, .negative-section {
      background: var(--surface);
      border: 1px solid var(--border-soft);
      border-radius: var(--radius);
      padding: 7px 9px;
    }
    .negative-section { border-color: rgba(248,81,73,0.2); }

    /* ── Debug panel ── */
    .debug-body {
      font-size: 10px;
      color: var(--text-muted);
      font-family: 'Consolas', 'Courier New', monospace;
      line-height: 1.6;
    }
    .debug-row { margin-bottom: 2px; }
    .debug-row strong { color: var(--text); }
    .debug-divider { border: none; border-top: 1px solid var(--border-soft); margin: 5px 0; }
    .debug-hint {
      font-style: italic;
      font-size: 9px;
      color: var(--text-dim);
      margin-top: 4px;
    }
    kbd {
      background: var(--surface3);
      border: 1px solid var(--border);
      border-radius: 3px;
      padding: 0 3px;
      font-size: 9px;
    }

    /* ── Copy / Action row ── */
    .action-row { display: flex; gap: 4px; }
    .btn-action {
      flex: 1;
      padding: 5px 8px;
      background: var(--surface2);
      color: var(--text);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      font-size: 10px;
      font-weight: 600;
      cursor: pointer;
      transition: background 0.15s, border-color 0.15s;
      text-align: center;
    }
    .btn-action:hover { background: var(--surface3); border-color: var(--text-muted); }
    .btn-action.amber {
      background: rgba(245,158,11,0.12);
      border-color: rgba(245,158,11,0.35);
      color: #fbbf24;
    }
    .btn-action.amber:hover { background: rgba(245,158,11,0.2); }
    .btn-action.blue {
      background: rgba(59,130,246,0.12);
      border-color: rgba(59,130,246,0.35);
      color: #93c5fd;
    }
    .btn-action.blue:hover { background: rgba(59,130,246,0.2); }

    /* ── Clear highlights button ── */
    .btn-clear-hl {
      width: 100%;
      padding: 5px;
      background: transparent;
      color: var(--warn);
      border: 1px solid rgba(210,153,34,0.35);
      border-radius: var(--radius);
      font-size: 10px;
      font-weight: 600;
      cursor: pointer;
      transition: background 0.15s;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 4px;
    }
    .btn-clear-hl:hover { background: rgba(210,153,34,0.1); }

    /* ── Highlight legend ── */
    .hl-legend {
      display: flex;
      align-items: center;
      gap: 6px;
      flex-wrap: wrap;
      padding: 5px 8px;
      background: var(--surface);
      border: 1px solid var(--border-soft);
      border-radius: var(--radius);
    }
    .hl-legend-title {
      font-size: 9px;
      font-weight: 700;
      color: var(--text-dim);
      text-transform: uppercase;
      letter-spacing: 0.4px;
    }
    .hl-swatch {
      display: flex;
      align-items: center;
      gap: 3px;
      font-size: 9px;
      font-weight: 600;
      color: var(--text-muted);
    }
    .hl-swatch-dot {
      width: 8px;
      height: 8px;
      border-radius: 2px;
      border: 1px solid;
      display: inline-block;
      flex-shrink: 0;
    }

    /* ── Status / Error ── */
    .status-msg {
      text-align: center;
      padding: 20px 12px;
      color: var(--text-muted);
      font-size: 11px;
    }
    .error-msg {
      color: #f85149;
      background: rgba(248,81,73,0.08);
      border-radius: var(--radius);
      border: 1px solid rgba(248,81,73,0.2);
      padding: 10px;
    }

    /* ── Pages footer ── */
    .pages-footer {
      font-size: 9px;
      color: var(--text-dim);
      padding: 3px 1px 0;
      line-height: 1.5;
    }
    .page-badge {
      display: inline-block;
      background: var(--surface3);
      padding: 1px 5px;
      border-radius: 8px;
      margin: 1px 2px 1px 0;
    }

    /* ── Utility ── */
    .hidden { display: none !important; }
    .section-divider { border: none; border-top: 1px solid var(--border-soft); }
  </style>
</head>
<body>
  <div class="popup-wrap">

    <!-- Header -->
    <div class="header">
      <div class="header-left">
        <span class="header-title" id="headerTitle">🧱 <span class="accent-hs" id="headerAccent">Hardscape</span> Finder</span>
        <span class="ver-badge">v5.0</span>
      </div>
      <div class="header-actions">
        <button class="btn-icon" id="debugToggleBtn" title="Toggle debug panel (D)">🛠</button>
        <span class="status-chip" id="pageIndicator">Ready</span>
      </div>
    </div>

    <!-- Mode Toggle -->
    <div class="mode-toggle">
      <button class="mode-btn active-hvac" id="modeHvacBtn">🌡️ HVAC</button>
      <button class="mode-btn" id="modeHsBtn">🧱 Hardscaping</button>
    </div>

    <!-- Progress bar -->
    <div class="progress-bar" id="progressBar">
      <div class="progress-fill" id="progressFill"></div>
    </div>

    <!-- Scan buttons -->
    <div class="scan-row">
      <button class="btn-scan-primary hvac-mode" id="scanBtn">🔍 Quick Scan</button>
      <button class="btn-scan-secondary hvac-mode" id="deepScanBtn">🌐 Deep Scan</button>
    </div>

    <!-- Debug panel (collapsible) -->
    <div class="collapsible hidden" id="debugPanel">
      <div class="collapsible-header" id="debugPanelHeader">
        <span class="collapsible-title">🛠 Debug Information</span>
        <span class="collapsible-arrow">▼</span>
      </div>
      <div class="collapsible-body debug-body" id="debugBody">
        <div class="debug-row" style="color:var(--text-dim)">Run a scan to see debug info here.</div>
      </div>
    </div>

    <!-- Results -->
    <div id="resultContainer">
      <div class="status-msg">Select a mode above, then click <strong>Quick Scan</strong> to analyze this site.</div>
    </div>

    <!-- Copy / Action section -->
    <div id="copySection" class="hidden">
      <div class="action-row">
        <button class="btn-action blue" id="copyPrimaryBtn">📋 Copy Score</button>
        <button class="btn-action" id="copyAllBtn">📄 Full Report</button>
      </div>
    </div>

    <!-- Clear highlights -->
    <button class="btn-clear-hl hidden" id="clearHighlightsBtn">✕ Clear Highlights</button>

    <!-- Highlight legend -->
    <div class="hl-legend hidden" id="hlLegend">
      <span class="hl-legend-title">Legend</span>
      <span id="hlLegendSwatches"></span>
    </div>

  </div>
  <script src="popup.js"></script>
</body>
</html>
